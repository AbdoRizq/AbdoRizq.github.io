<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizPulse | لوحة إدارة المبيعات والمصروفات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131a2a;
            --bg-input: #1a2338;
            --accent: #e11d48;
            --accent-hover: #be123c;
            --green: #10b981;
            --green-soft: rgba(16, 185, 129, 0.15);
            --red: #f43f5e;
            --red-soft: rgba(244, 63, 94, 0.15);
            --blue: #3b82f6;
            --blue-soft: rgba(59, 130, 246, 0.15);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Cairo', sans-serif;
            line-height: 1.6;
            padding-bottom: 50px;
        }

        html[lang="en"] body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            background: rgba(19, 26, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
            margin-bottom: 28px;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.35rem;
            font-weight: 800;
        }

        .brand span {
            color: var(--accent);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            border-color: var(--accent);
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }

        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .kpi-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .kpi-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .kpi-value {
            font-size: 1.75rem;
            font-weight: 800;
        }

        /* Main Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1.6fr;
            gap: 22px;
            margin-bottom: 28px;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Form */
        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.92rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .chart-container {
            position: relative;
            height: 290px;
            width: 100%;
        }

        /* Table Section */
        .table-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th, td {
            padding: 13px 14px;
            text-align: right;
            border-bottom: 1px solid var(--border);
            font-size: 0.92rem;
        }

        html[lang="en"] th, html[lang="en"] td {
            text-align: left;
        }

        th {
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 0.84rem;
        }

        .badge-type {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .badge-income {
            background: var(--green-soft);
            color: var(--green);
        }

        .badge-expense {
            background: var(--red-soft);
            color: var(--red);
        }

        .del-btn {
            background: transparent;
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: var(--red);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .del-btn:hover {
            background: var(--red);
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <div class="nav-bar">
                <div class="brand">📊 Biz<span>Pulse</span></div>
                <div class="nav-actions">
                    <a href="../index.html" class="btn" data-i18n="back_btn">← البورتفوليو</a>
                    <button class="btn" onclick="resetDemo()" data-i18n="reset_btn">إعادة ضبط</button>
                    <button class="btn" id="langBtn" onclick="toggleLang()">English</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- KPI Summary -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-top">
                    <span data-i18n="kpi_rev">إجمالي الإيرادات</span>
                    <div class="kpi-icon" style="background: var(--green-soft); color: var(--green);">💰</div>
                </div>
                <div class="kpi-value" id="totalIncome" style="color: var(--green);">0 EGP</div>
            </div>

            <div class="kpi-card">
                <div class="kpi-top">
                    <span data-i18n="kpi_exp">إجمالي المصروفات</span>
                    <div class="kpi-icon" style="background: var(--red-soft); color: var(--red);">📉</div>
                </div>
                <div class="kpi-value" id="totalExpense" style="color: var(--red);">0 EGP</div>
            </div>

            <div class="kpi-card">
                <div class="kpi-top">
                    <span data-i18n="kpi_net">صافي الربح</span>
                    <div class="kpi-icon" style="background: var(--blue-soft); color: var(--blue);">📈</div>
                </div>
                <div class="kpi-value" id="netProfit">0 EGP</div>
            </div>

            <div class="kpi-card">
                <div class="kpi-top">
                    <span data-i18n="kpi_count">عدد المعاملات</span>
                    <div class="kpi-icon" style="background: rgba(255,255,255,0.08);">🧾</div>
                </div>
                <div class="kpi-value" id="txCount">0</div>
            </div>
        </div>

        <!-- Add Form + Chart -->
        <div class="dashboard-grid">
            <div class="panel">
                <div class="panel-title" data-i18n="add_title">➕ إضافة معاملة جديدة</div>
                <form id="txForm">
                    <div class="form-group">
                        <label data-i18n="lbl_desc">وصف العملية / العميل</label>
                        <input type="text" id="txTitle" class="form-control" placeholder="مثال: توريد طلبية عميل / إعلانات ممولة" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label data-i18n="lbl_type">النوع</label>
                            <select id="txType" class="form-control">
                                <option value="income" data-i18n="opt_inc">مبيعات / دخل (+)</option>
                                <option value="expense" data-i18n="opt_exp">مصروفات (-)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label data-i18n="lbl_amount">المبلغ (EGP)</label>
                            <input type="number" id="txAmount" class="form-control" min="1" step="any" placeholder="1500" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label data-i18n="lbl_cat">التصنيف</label>
                            <select id="txCategory" class="form-control">
                                <option value="Sales">مبيعات مباشرة</option>
                                <option value="Services">خدمات وتصميم</option>
                                <option value="Marketing">تسويق وإعلانات</option>
                                <option value="Operations">تشغيل وخامات</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label data-i18n="lbl_date">التاريخ</label>
                            <input type="date" id="txDate" class="form-control" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 11px; margin-top: 6px;" data-i18n="btn_save">
                        حفظ وإضافة للجدول
                    </button>
                </form>
            </div>

            <div class="panel">
                <div class="panel-title" data-i18n="chart_title">📊 تحليل التدفقات المالية</div>
                <div class="chart-container">
                    <canvas id="financeChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Transactions Table -->
        <div class="panel">
            <div class="panel-title">
                <span data-i18n="table_title">📋 سجل المعاملات المالية</span>
                <div class="table-controls">
                    <select id="filterSelect" class="form-control" style="width: auto; padding: 6px 12px;" onchange="renderAll()">
                        <option value="all" data-i18n="flt_all">الكل</option>
                        <option value="income" data-i18n="flt_inc">المبيعات فقط</option>
                        <option value="expense" data-i18n="flt_exp">المصروفات فقط</option>
                    </select>
                    <button class="btn" onclick="exportCSV()" data-i18n="btn_csv">📥 تصدير CSV</button>
                </div>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th data-i18n="th_date">التاريخ</th>
                            <th data-i18n="th_desc">البيان</th>
                            <th data-i18n="th_cat">التصنيف</th>
                            <th data-i18n="th_type">النوع</th>
                            <th data-i18n="th_amount">المبلغ</th>
                            <th data-i18n="th_action">إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="txTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const defaultData = [
            { id: 1, title: "حملة تصميم وهوية بصرية — شركة النيل", type: "income", amount: 4500, category: "Services", date: "2026-11-10" },
            { id: 2, title: "مبيعات متجر إلكتروني — دفعة #104", type: "income", amount: 8200, category: "Sales", date: "2026-11-12" },
            { id: 3, title: "إعلانات ممولة Meta Ads", type: "expense", amount: 1850, category: "Marketing", date: "2026-11-14" },
            { id: 4, title: "توريد عبوات وتغليف", type: "expense", amount: 2300, category: "Operations", date: "2026-11-16" },
            { id: 5, title: "تطوير صفحة هبوط وتكامل واتساب", type: "income", amount: 6000, category: "Services", date: "2026-11-18" }
        ];

        let transactions = JSON.parse(localStorage.getItem('bizpulse_tx')) || [...defaultData];
        let currentLang = 'ar';
        let chartInstance = null;

        document.getElementById('txDate').valueAsDate = new Date();

        document.getElementById('txForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newTx = {
                id: Date.now(),
                title: document.getElementById('txTitle').value.trim(),
                type: document.getElementById('txType').value,
                amount: parseFloat(document.getElementById('txAmount').value),
                category: document.getElementById('txCategory').value,
                date: document.getElementById('txDate').value
            };
            transactions.unshift(newTx);
            saveData();
            renderAll();
            this.reset();
            document.getElementById('txDate').valueAsDate = new Date();
        });

        function deleteTx(id) {
            transactions = transactions.filter(t => t.id !== id);
            saveData();
            renderAll();
        }

        function resetDemo() {
            transactions = [...defaultData];
            saveData();
            renderAll();
        }

        function saveData() {
            localStorage.setItem('bizpulse_tx', JSON.stringify(transactions));
        }

        function renderAll() {
            const filter = document.getElementById('filterSelect').value;
            let inc = 0, exp = 0;

            transactions.forEach(t => {
                if (t.type === 'income') inc += t.amount;
                else exp += t.amount;
            });

            const net = inc - exp;
            document.getElementById('totalIncome').textContent = inc.toLocaleString() + ' EGP';
            document.getElementById('totalExpense').textContent = exp.toLocaleString() + ' EGP';
            const netEl = document.getElementById('netProfit');
            netEl.textContent = net.toLocaleString() + ' EGP';
            netEl.style.color = net >= 0 ? 'var(--blue)' : 'var(--red)';
            document.getElementById('txCount').textContent = transactions.length;

            const tbody = document.getElementById('txTableBody');
            tbody.innerHTML = '';

            const filtered = transactions.filter(t => filter === 'all' || t.type === filter);
            filtered.forEach(t => {
                const isInc = t.type === 'income';
                const badgeText = currentLang === 'ar' ? (isInc ? 'إيراد' : 'مصروف') : (isInc ? 'Income' : 'Expense');
                const delText = currentLang === 'ar' ? 'حذف' : 'Delete';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${t.date}</td>
                    <td style="font-weight:600;">${t.title}</td>
                    <td>${t.category}</td>
                    <td><span class="badge-type ${isInc ? 'badge-income' : 'badge-expense'}">${badgeText}</span></td>
                    <td style="font-weight:700; color:${isInc ? 'var(--green)' : 'var(--red)'};">${isInc ? '+' : '-'}${t.amount.toLocaleString()} EGP</td>
                    <td><button class="del-btn" onclick="deleteTx(${t.id})">${delText}</button></td>
                `;
                tbody.appendChild(tr);
            });

            updateChart(inc, exp, net);
        }

        function updateChart(inc, exp, net) {
            const ctx = document.getElementById('financeChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            const labels = currentLang === 'ar'
                ? ['الإيرادات', 'المصروفات', 'صافي الربح']
                : ['Revenue', 'Expenses', 'Net Profit'];

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'EGP',
                        data: [inc, exp, Math.max(0, net)],
                        backgroundColor: [
                            'rgba(16, 185, 129, 0.75)',
                            'rgba(244, 63, 94, 0.75)',
                            'rgba(59, 130, 246, 0.75)'
                        ],
                        borderColor: ['#10b981', '#f43f5e', '#3b82f6'],
                        borderWidth: 2,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255,255,255,0.06)' },
                            ticks: { color: '#94a3b8' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#f8fafc', font: { family: 'Cairo', weight: 'bold' } }
                        }
                    }
                }
            });
        }

        function exportCSV() {
            let csv = "\uFEFFDate,Description,Category,Type,Amount(EGP)\n";
            transactions.forEach(t => {
                csv += `"${t.date}","${t.title}","${t.category}","${t.type}",${t.amount}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "BizPulse_Report.csv";
            link.click();
        }

        const i18n = {
            ar: {
                back_btn: "← البورتفوليو",
                reset_btn: "إعادة ضبط",
                kpi_rev: "إجمالي الإيرادات",
                kpi_exp: "إجمالي المصروفات",
                kpi_net: "صافي الربح",
                kpi_count: "عدد المعاملات",
                add_title: "➕ إضافة معاملة جديدة",
                lbl_desc: "وصف العملية / العميل",
                lbl_type: "النوع",
                opt_inc: "مبيعات / دخل (+)",
                opt_exp: "مصروفات (-)",
                lbl_amount: "المبلغ (EGP)",
                lbl_cat: "التصنيف",
                lbl_date: "التاريخ",
                btn_save: "حفظ وإضافة للجدول",
                chart_title: "📊 تحليل التدفقات المالية",
                table_title: "📋 سجل المعاملات المالية",
                flt_all: "الكل",
                flt_inc: "المبيعات فقط",
                flt_exp: "المصروفات فقط",
                btn_csv: "📥 تصدير CSV",
                th_date: "التاريخ",
                th_desc: "البيان",
                th_cat: "التصنيف",
                th_type: "النوع",
                th_amount: "المبلغ",
                th_action: "إجراء"
            },
            en: {
                back_btn: "← Portfolio",
                reset_btn: "Reset Demo",
                kpi_rev: "Total Revenue",
                kpi_exp: "Total Expenses",
                kpi_net: "Net Profit",
                kpi_count: "Transactions",
                add_title: "➕ Add Transaction",
                lbl_desc: "Description / Client",
                lbl_type: "Type",
                opt_inc: "Revenue / Income (+)",
                opt_exp: "Expense (-)",
                lbl_amount: "Amount (EGP)",
                lbl_cat: "Category",
                lbl_date: "Date",
                btn_save: "Save Transaction",
                chart_title: "📊 Financial Overview",
                table_title: "📋 Transactions Log",
                flt_all: "All",
                flt_inc: "Income Only",
                flt_exp: "Expenses Only",
                btn_csv: "📥 Export CSV",
                th_date: "Date",
                th_desc: "Description",
                th_cat: "Category",
                th_type: "Type",
                th_amount: "Amount",
                th_action: "Action"
            }
        };

        function toggleLang() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langBtn').textContent = currentLang === 'ar' ? 'English' : 'عربي';

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang][key]) el.textContent = i18n[currentLang][key];
            });
            renderAll();
        }

        renderAll();
    </script>
</body>
</html>
